<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wGradient" x1="10" y1="18" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5F0"/>
      <stop offset="0.48" stop-color="#087BFF"/>
      <stop offset="1" stop-color="#9B28F5"/>
    </linearGradient>
    <linearGradient id="orbitGradient" x1="5" y1="45" x2="58" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5F0"/>
      <stop offset="0.52" stop-color="#1685FF"/>
      <stop offset="1" stop-color="#B44BFF"/>
    </linearGradient>
    <radialGradient id="planetGradient" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#D9A7FF"/>
      <stop offset="1" stop-color="#8B35F5"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#080F20"/>

  <!-- Bold W monogram -->
  <path d="M10.5 19.5 L19.7 43.2 Q21 46.7 23.2 43.2 L31.8 25.4
           Q32.8 23.3 33.8 25.4 L42.1 43.2 Q43.8 46.7 45.5 43.2
           L54 19.5"
        fill="none" stroke="url(#wGradient)" stroke-width="7.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orbit sweeping around the W -->
  <path d="M7.2 42.2 C12.4 54.5 33.4 53.5 48.2 37.2
           C55.1 29.6 59.1 20.5 55.4 13.2"
        fill="none" stroke="url(#orbitGradient)" stroke-width="3.1"
        stroke-linecap="round"/>

  <!-- Orbital trail above the W -->
  <path d="M39.5 13.4 C45.2 9.6 50.2 8.2 54.3 9.1"
        fill="none" stroke="#438BFF" stroke-width="1.8"
        stroke-linecap="round"/>

  <circle cx="55" cy="11.2" r="4.3" fill="url(#planetGradient)"/>
  <circle cx="53.7" cy="9.9" r="1.1" fill="#FFFFFF" opacity=".85"/>
</svg>
